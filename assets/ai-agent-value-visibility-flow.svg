<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title description">
  <title id="title">From agent activity to business value</title>
  <desc id="description">A four-step flow connects the business process to an agent run, an evidence trace, and validated business outcomes. A continuous human oversight and control layer spans the complete flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" fill="#64748b" />
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #0f172a; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .detail { font-size: 15px; fill: #475569; }
      .step { stroke-width: 2; }
    </style>
  </defs>
  <rect width="1040" height="360" fill="#ffffff" />
  <text class="heading" x="40" y="46">Make every agent run explainable in business terms</text>

  <g aria-label="Business process">
    <rect class="step" x="40" y="92" width="205" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" />
    <circle cx="66" cy="118" r="15" fill="#2563eb" />
    <text x="66" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text class="label" x="142" y="151" text-anchor="middle">Business process</text>
    <text class="detail" x="142" y="180" text-anchor="middle">Case · baseline · owner</text>
  </g>
  <path d="M250 150h34" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <g aria-label="Agent execution">
    <rect class="step" x="295" y="92" width="205" height="116" rx="14" fill="#f3e8ff" stroke="#7c3aed" />
    <circle cx="321" cy="118" r="15" fill="#7c3aed" />
    <text x="321" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text class="label" x="398" y="151" text-anchor="middle">Agent execution</text>
    <text class="detail" x="398" y="180" text-anchor="middle">Model · tools · policy</text>
  </g>
  <path d="M505 150h34" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <g aria-label="Evidence trace">
    <rect class="step" x="550" y="92" width="205" height="116" rx="14" fill="#f5f3ff" stroke="#7c3aed" />
    <circle cx="576" cy="118" r="15" fill="#7c3aed" />
    <text x="576" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text class="label" x="653" y="151" text-anchor="middle">Evidence trace</text>
    <text class="detail" x="653" y="180" text-anchor="middle">Action · data · cost · review</text>
  </g>
  <path d="M760 150h34" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <g aria-label="Business outcome">
    <rect class="step" x="805" y="92" width="195" height="116" rx="14" fill="#ecfdf5" stroke="#059669" />
    <circle cx="831" cy="118" r="15" fill="#059669" />
    <text x="831" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text class="label" x="902" y="151" text-anchor="middle">Business value</text>
    <text class="detail" x="902" y="180" text-anchor="middle">Quality · speed · net value</text>
  </g>

  <rect x="40" y="254" width="960" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="520" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">CONTINUOUS CONTROL &amp; ASSURANCE</text>
  <text class="detail" x="520" y="307" text-anchor="middle">Human oversight · scoped permissions · data minimisation · jurisdiction-aware policy · stop and recovery paths</text>
</svg>
